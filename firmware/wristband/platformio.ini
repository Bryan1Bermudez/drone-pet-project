; Wristband firmware for an ESP32-C3 "super mini" board.
;
;   pio run -e led-beacon -t upload   blinking camera beacon + BLE (current build)
;   pio run -e uwb -t upload          same, plus UWB tag (later upgrade, add a DW3000)

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBAND_ID=1
    ; must match BEACON_BLINK_HZ in firmware/drone-esp32cam/platformio.ini
    -DBLINK_HZ=2.5f

[env:led-beacon]
build_flags =
    ${env.build_flags}
    -DUWB_ENABLED=0

[env:uwb]
build_flags =
    ${env.build_flags}
    -DUWB_ENABLED=1
lib_deps =
    ; DW3000 driver. Pin to a tested version once bring-up is done.
    https://github.com/Makerfabs/Makerfabs-ESP32-UWB-DW3000.git
