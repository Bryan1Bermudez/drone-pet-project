[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBAND_ID=1
lib_deps =
    ; DW3000 driver. Pin to a tested version once bring-up is done.
    https://github.com/Makerfabs/Makerfabs-ESP32-UWB-DW3000.git
