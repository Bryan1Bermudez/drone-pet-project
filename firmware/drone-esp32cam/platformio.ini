; ESP32-CAM follow-me firmware for the budget build.
;
; Flash with the ESP32-CAM-MB base or a USB-UART adapter (GPIO0 to GND while resetting).
; Disconnect the flight controller from GPIO14 while flashing is not required, but
; disconnect the VL53L0X from GPIO15 if the upload fails to start.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; ---- tuning (mirrors firmware/companion/follow/visual.py defaults) -------
    -DHOVER_THROTTLE=1450
    -DTARGET_HEIGHT_M=1.2f
    -DFOLLOW_ENABLED=1
    ; set to 1 for a Wi-Fi MJPEG debug stream on the bench (never in flight)
    -DDEBUG_STREAM=0
    -DWIFI_SSID='"your-ssid"'
    -DWIFI_PASS='"your-password"'
lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.4
